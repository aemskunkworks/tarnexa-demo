<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragment review — Tarnexa</title>
<!-- DA.live plugin shell: the MLR reviewer surface.
     Registered in the aemskunkworks org CONFIG sheet (same pattern as the Birch Creek library app).
     PoC data source: ./queue.json (static, shaped like the classify.mjs --out report).
     Production: a worker holding a GitHub App token lists PRs labelled review:human|regulated,
     fetches .ci/reports/*.json from the PR, and submits an approving review on "Approve". -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --tide:#2B4C5C; --tide-deep:#1D3541; --marsh:#8A9A5B; --marsh-soft:#E4E8D6; --silt:#7A3B2E; --ground:#F2F4F1; --paper:#fff; --ink:#1C2226; --ink-soft:#55615F; --rule:#CBD2CF;
    --font-serif:"Source Serif 4",Georgia,serif; --font-sans:"Source Sans 3",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace; }
  * { box-sizing:border-box } body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-sans); font-size:15px; line-height:1.5 }
  header { background:var(--paper); border-bottom:1px solid var(--rule); padding:14px 20px; display:flex; align-items:baseline; gap:16px }
  header h1 { font-family:var(--font-serif); font-size:1.3rem; font-weight:600; margin:0 } header span { color:var(--ink-soft); font-size:.9rem }
  main { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 56px) }
  @media (max-width:760px){
    main { grid-template-columns:1fr; min-height:0 }
    aside { border-right:0; border-bottom:1px solid var(--rule); padding:12px }
    section { padding:12px 14px; gap:12px }
    .card { padding:12px 14px }
    .meta { grid-template-columns:1fr 1fr; gap:8px }
    .meta .mono, .badge { font-size:.8rem; word-break:break-all }
    table thead { display:none }
    table tr { display:grid; grid-template-columns:1fr; border-bottom:1px solid var(--rule); padding:8px 0 }
    table td { border:0; padding:2px 0 }
    td.diff::before { font-size:.72rem; color:var(--ink-soft); font-family:var(--font-sans); display:block }
    td.diff:nth-child(3)::before { content:"before" } td.diff:nth-child(4)::before { content:"after" }
    .actions { flex-direction:column; align-items:stretch } .actions button { width:100% }
  }
  header { flex-wrap:wrap; gap:8px 16px }
  header .pop { margin-left:auto; font-size:.85rem; color:var(--tide); white-space:nowrap }
  aside { border-right:1px solid var(--rule); background:var(--paper); padding:16px }
  aside h2, section h2 { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin:0 0 10px }
  .queue { list-style:none; margin:0; padding:0; display:grid; gap:8px }
  .queue button { width:100%; text-align:left; background:var(--ground); border:1px solid var(--rule); padding:10px 12px; font:inherit; cursor:pointer; display:grid; gap:4px }
  .queue button[aria-pressed="true"] { border-color:var(--tide); background:var(--paper) }
  .queue .id { font-family:var(--font-mono); font-size:.85rem }
  .tier { display:inline-block; font-family:var(--font-mono); font-size:.75rem; padding:2px 7px; border:1px solid currentColor }
  .tier.auto { color:var(--marsh) } .tier.human { color:var(--tide) } .tier.regulated { color:var(--silt) }
  section { padding:20px 24px; display:grid; gap:20px; align-content:start }
  .card { background:var(--paper); border:1px solid var(--rule); padding:16px 18px }
  .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px }
  .meta b { display:block; font-size:.78rem; color:var(--ink-soft); font-weight:600 } .meta .mono { font-family:var(--font-mono); font-size:.88rem }
  .badge { font-family:var(--font-mono); font-size:.85rem } .badge .dots { color:var(--marsh); letter-spacing:2px }
  table { width:100%; border-collapse:collapse; font-size:.92rem } th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:top }
  th { font-size:.78rem; color:var(--ink-soft) } td.path { font-family:var(--font-mono); font-size:.85rem } td.diff { font-family:var(--font-mono); font-size:.85rem; white-space:pre-wrap; word-break:break-word }
  tr.regulated td.path { color:var(--silt) }
  .reasons { margin:0; padding-left:1.2em; color:var(--ink-soft); font-size:.92rem }
  .attest label { display:flex; gap:10px; align-items:flex-start; margin:6px 0 } .attest input { margin-top:4px }
  .actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center }
  button.primary { background:var(--tide); color:#fff; border:1.5px solid var(--tide); padding:10px 18px; font:inherit; font-weight:500; cursor:pointer } button.primary:disabled { opacity:.45; cursor:not-allowed }
  button.ghost { background:none; border:1.5px solid var(--tide); color:var(--tide); padding:10px 18px; font:inherit; cursor:pointer }
  .toast { font-size:.92rem; color:var(--ink-soft) }
  .empty { color:var(--ink-soft) }
</style>
</head>
<body>
<header><h1>Fragment review</h1><span>Saltmarsh Therapeutics · product-claim · MLR</span><a class="pop" id="pop" href="#" target="_blank" rel="noopener" hidden>Open full page ↗</a></header>
<main>
  <aside><h2>Waiting for review</h2><ul class="queue" id="queue"></ul></aside>
  <section id="detail"><p class="empty">Select a fragment.</p></section>
</main>
<script>
(async () => {
  const pop = document.getElementById('pop'); if (window.self !== window.top) { pop.href = window.location.href; pop.hidden = false; }
  const queueEl = document.getElementById('queue'); const detail = document.getElementById('detail');
  let items = [];
  try { items = await fetch('./queue.json').then(r => r.json()); } catch { items = []; }
  const human = items.filter(i => i.tier !== 'auto');
  if (!human.length) queueEl.innerHTML = '<li class="empty">Nothing waiting. Auto-tier changes merged on green checks.</li>';
  const badge = (s) => s == null ? '— (no history)' : `${s.toFixed(2)} <span class="dots">${s >= .8 ? '●●●' : s >= .5 ? '●●○' : '●○○'}</span>`;
  const cell = (v) => v === undefined ? '—' : typeof v === 'string' ? v : JSON.stringify(v);
  function render(item) {
    detail.innerHTML = `
      <div class="card"><div class="meta">
        <div><b>Fragment</b><span class="mono">${item.fragment}</span></div>
        <div><b>Tier</b><span class="tier ${item.tier}">${item.tier}</span> <span style="color:var(--ink-soft);font-size:.85rem">(field tier ${item.fieldTier})</span></div>
        <div><b>Author</b><span class="badge">${item.author} · ${badge(item.authorScore)}</span></div>
        <div><b>Source</b><span class="badge">${item.source} · ${badge(item.sourceScore)}</span></div>
      </div></div>
      <div class="card"><h2>Changed fields (${item.changes.length})</h2>
        <table><thead><tr><th>Field</th><th>Tier</th><th>Before</th><th>After</th></tr></thead><tbody>
        ${item.changes.map(c => `<tr class="${c.tier}"><td class="path">${c.path}</td><td><span class="tier ${c.tier}">${c.tier}</span></td><td class="diff">${c.pii ? '[redacted]' : cell(c.before)}</td><td class="diff">${c.pii ? '[redacted]' : cell(c.after)}</td></tr>`).join('')}
        </tbody></table></div>
      ${item.reasons?.length ? `<div class="card"><h2>Why this tier</h2><ul class="reasons">${item.reasons.map(r => `<li>${r}</li>`).join('')}</ul></div>` : ''}
      <div class="card attest"><h2>MLR attestation</h2>
        <label><input type="checkbox"> I reviewed every field listed above at tier human or regulated.</label>
        <label><input type="checkbox"> claimText is consistent with the cited references and the approved PI; every figure appears in dataPoints and a cited reference.</label>
        <label><input type="checkbox"> The claim stays within scope; no comparison to a named marketed product.</label>
        <label><input type="checkbox"> The required safety statement is referenced and fair-balance text is verbatim.</label>
        <div class="actions" style="margin-top:12px"><button class="primary" id="approve" disabled>Approve and merge</button><button class="ghost" id="changes">Request changes</button><span class="toast" id="toast"></span></div>
      </div>`;
    const boxes = [...detail.querySelectorAll('input[type=checkbox]')]; const approve = detail.querySelector('#approve');
    boxes.forEach(b => b.addEventListener('change', () => { approve.disabled = !boxes.every(x => x.checked); }));
    approve.addEventListener('click', () => { detail.querySelector('#toast').textContent = `Approved ${item.fragment}. In production this submits a GitHub review with the attestation and merges.`; approve.disabled = true; });
    detail.querySelector('#changes').addEventListener('click', () => { detail.querySelector('#toast').textContent = 'In production this posts a "changes requested" review on the PR.'; });
  }
  human.forEach((item, i) => {
    const li = document.createElement('li'); const b = document.createElement('button'); b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<span class="id">${item.fragment}</span><span><span class="tier ${item.tier}">${item.tier}</span> <span style="color:var(--ink-soft);font-size:.85rem">${item.changes.length} field${item.changes.length === 1 ? '' : 's'} · ${item.source}</span></span>`;
    b.addEventListener('click', () => { queueEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); render(item); });
    li.append(b); queueEl.append(li); if (i === 0) b.click();
  });
})();
</script>
</body>
</html>
